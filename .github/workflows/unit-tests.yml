name: Unit Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Supported range is Python 3.11+ (must match the setup.py floor).
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Create runtime control dirs (gitignored, required by tests)
        run: mkdir -p hashview/control/{hashes,logs,rules,tmp,wordlists,wordlists_import}
      # Coverage ratchet: raise --cov-fail-under as coverage improves; never lower it.
      # --cov-branch enables branch (decision) coverage in addition to line coverage,
      # so the term-missing/xml/json reports now flag partially-covered branches.
      # The 85% ratchet remains a LINE threshold and is intentionally unchanged.
      - name: Run unit + security + agent tests with coverage
        run: |
          python -m pytest tests/unit tests/security tests/agent_unit \
            --cov=hashview --cov-branch --cov-report=term-missing --cov-report=xml \
            --cov-report=json:coverage.json --cov-fail-under=85 -q
      # Enforce the function-level gate: fail if any function in hashview/ has
      # zero executed body lines (waivers live in the allowlist, kept empty).
      - name: Enforce function-level coverage gate
        run: python tests/check_function_coverage.py coverage.json
      # Separate coverage gate for the agent package (install/hashview-agent/agent).
      # Kept distinct from the --cov=hashview line ratchet above: different source
      # root, its own --cov-fail-under, and intentionally NO json report so it does
      # not overwrite the hashview coverage.json the function gate consumes. Runs
      # AFTER the function gate for belt-and-suspenders isolation. The agent root is
      # placed on sys.path by tests/agent_unit/conftest.py, so modules import as
      # `agent.*` and --cov=agent resolves them.
      #
      # The 75% floor is a RATCHET: raise it as agent coverage improves, never lower
      # it. Measured ~77% at the time this gate was added (config.py is stubbed out
      # by conftest, so its lines are intentionally uncovered here).
      - name: Run agent tests with agent-scoped coverage
        run: |
          python -m pytest tests/agent_unit \
            --cov=agent --cov-report=term-missing --cov-fail-under=75 -q
      # Only the floor (3.11) leg uploads coverage, so the matrix doesn't produce
      # duplicate artifact names and the badge stays deterministic.
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # Render a live coverage badge from coverage.xml and publish it to an orphan
  # `badges` branch using the built-in GITHUB_TOKEN (no PAT, no third-party
  # service). The README points at the raw SVG on that branch. Runs only on
  # pushes to the active dev/release branches — never on PRs (fork tokens are
  # read-only) — and force-pushes a single-commit branch so history never grows.
  coverage-badge:
    needs: unit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/v0.8.3-dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: Render coverage badge
        run: |
          python -m pip install --upgrade pip
          pip install "genbadge[coverage]"
          genbadge coverage -i coverage.xml -o coverage.svg
      - name: Publish badge to badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          cp coverage.svg "$tmp/coverage.svg"
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b badges
          git add coverage.svg
          git commit -q -m "ci: update coverage badge [skip ci]"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
