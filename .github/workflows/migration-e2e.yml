name: Migration E2E

# `pull_request` covers every branch that has a PR open, so `push` is scoped to the
# long-lived branches. An unscoped `push` next to `pull_request` runs this whole
# workflow twice on a single PR-branch commit, once per event.
on:
  push:
    branches: [main, "v*-dev"]
  pull_request:

permissions:
  contents: read

jobs:
  migration-e2e:
    runs-on: ubuntu-latest
    # Builds two app images (hashview:main from origin/main + hashview:dev from
    # the checkout) and cycles a MySQL compose stack. Two cold docker builds +
    # two MySQL boots + a venv install need headroom on a fresh runner.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The runner builds the "old" image from origin/main, so we need the
          # full history / that ref available locally.
          fetch-depth: 0

      - name: Ensure origin/main is available
        run: git fetch origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Run end-to-end main->dev migration test
        env:
          DOCKER_PLATFORM: linux/amd64
        run: ./tests/run_migration_e2e.sh
