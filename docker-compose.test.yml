services:
  agent-test:
    image: python@sha256:da047cb8f9d1d98e5c070f5300ba9f7274e33b8fc0e5be5ed88740aed1b95ba9  # python:3.11-slim
    profiles:
      - test
    working_dir: /app
    volumes:
      - .:/app
    environment:
      HASHVIEW_API_URL: http://app:5000
      HASHVIEW_AGENT_NAME: test-agent
      HASHVIEW_AGENT_VERSION: 0.8.3
      HASHVIEW_AGENT_MAX_SECONDS: 30
      HASHVIEW_AGENT_POLL_INTERVAL: 1.0
    depends_on:
      app:
        condition: service_started
    command: ["python", "tests/agent/sim.py"]
