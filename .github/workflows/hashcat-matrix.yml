name: hashcat Matrix

# Interoperability guard: Hashview parses hashcat's --status-json, benchmark
# and outfile output and depends on the flags build_hashcat_command emits.
# None of that is a stable API, and hashcatParser swallows unparseable status
# lines, so upstream drift would otherwise surface as a blank dashboard.
#
# Tier 2 (pinned) runs the real binary for each pinned release. Tier 3
# (floating) does the same for any release newer than the matrix and opens an
# issue rather than failing.

on:
  schedule:
    # Mondays 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "install/hashview-agent/**"
      - "hashview/utils/utils.py"
      - "hashview/utils/chunking.py"
      - "tests/hashcat_matrix/**"
      - "tests/fixtures/hashcat/**"
      - ".github/workflows/hashcat-matrix.yml"

permissions:
  contents: read

jobs:
  pinned:
    name: "hashcat ${{ matrix.version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 7.0.0 emits structurally invalid --status-json (stray '}' before "power"
    # in each device object; upstream issue #4393, fixed in 7.1.0). It stays in
    # the matrix as a canary proving the contract tests detect a real break,
    # but must not hold CI red.
    continue-on-error: ${{ matrix.blocking == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "7.0.0"
            sha256: "19e126642e1db7902125072dce539c53485c721735325a747bd03e8af3135d78"
            blocking: false
          - version: "7.1.0"
            sha256: "37be13b2dfdd1da7a3f68847ff817a22c144fc8d76170f51aae412e8b3ee24fd"
            blocking: true
          - version: "7.1.1"
            sha256: "e09f88233ae8a88e0e60d68c20e4f5094d9122af533a7d186a45d8d55d08f3a0"
            blocking: true
          - version: "7.1.2"
            sha256: "80db0316387794ce9d14ed376da75b8a7742972485b45db790f5f8260307ff98"
            blocking: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The runner has no GPU and no vendor OpenCL. pocl supplies a CPU device,
      # which is enough for a five-word NTLM crack and an NTLM benchmark.
      - name: Install pocl and p7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full pocl-opencl-icd ocl-icd-libopencl1

      - name: Fetch hashcat ${{ matrix.version }}
        id: fetch
        run: |
          dir="$(tests/hashcat_matrix/fetch.sh \
            '${{ matrix.version }}' '${{ matrix.sha256 }}' "${RUNNER_TEMP}/hc")"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Capture machine-readable output
        run: |
          tests/hashcat_matrix/capture.sh \
            '${{ steps.fetch.outputs.dir }}/hashcat.bin' \
            "${RUNNER_TEMP}/capture"
          python tests/hashcat_matrix/summarize.py "${RUNNER_TEMP}/capture"

      # Run the SAME assertions Tier 1 runs offline, but against output captured
      # from the real binary moments ago.
      - name: Assert the interop contract against the live capture
        run: |
          rm -rf "tests/fixtures/hashcat/${{ matrix.version }}"
          mkdir -p "tests/fixtures/hashcat/${{ matrix.version }}"
          cp "${RUNNER_TEMP}"/capture/* "tests/fixtures/hashcat/${{ matrix.version }}/"
          python -m pytest tests/agent_unit/test_hashcat_contract.py -q -rxX \
            -k '${{ matrix.version }}'

      # A skipped test exits 0, so assert these actually ran. The repo-root
      # conftest declares an autouse Playwright/live_server fixture that once
      # force-skipped this whole module even with HASHCAT_BIN set, which would
      # make this gate a no-op that always reports success.
      - name: Assert --skip/--limit slice semantics
        # shell: bash is load-bearing. The default shell for `run:` is
        # `bash -e {0}` WITHOUT pipefail, so `pytest | tee` would take tee's
        # exit status and a failing pytest would go green. `shell: bash` runs
        # `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        env:
          HASHCAT_BIN: ${{ steps.fetch.outputs.dir }}/hashcat.bin
        run: |
          python -m pytest tests/hashcat_matrix -q -rs | tee "${RUNNER_TEMP}/slice.log"
          if grep -q "skipped" "${RUNNER_TEMP}/slice.log"; then
            echo "::error::live --skip/--limit tests were skipped; the gate proved nothing"
            exit 1
          fi

      # Structural drift against the committed fixture. Raw captures embed
      # timestamps and measured speeds, so compare the volatile-free summary.
      - name: Diff the live capture against the committed fixture
        run: |
          git diff --no-index --exit-code \
            <(git show "HEAD:tests/fixtures/hashcat/${{ matrix.version }}/summary.json") \
            "${RUNNER_TEMP}/capture/summary.json"

      - name: Upload capture on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hashcat-capture-${{ matrix.version }}
          path: ${{ runner.temp }}/capture
          retention-days: 14

  floating:
    name: "hashcat (newest release)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Schedule and manual runs only: a new upstream release must not fail a PR
    # that did not cause it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install pocl and p7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full pocl-opencl-icd ocl-icd-libopencl1

      # Newest release tag with no fixture directory of its own.
      - name: Find an unpinned release
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$(gh api repos/hashcat/hashcat/releases/latest --jq '.tag_name' | sed 's/^v//')"
          echo "version=${latest}" >> "$GITHUB_OUTPUT"
          if [ -d "tests/fixtures/hashcat/${latest}" ]; then
            echo "Newest release ${latest} is already pinned; nothing to do."
            echo "unpinned=false" >> "$GITHUB_OUTPUT"
          else
            echo "unpinned=true" >> "$GITHUB_OUTPUT"
          fi

      # No pinned checksum exists for an unseen release, so record what was
      # actually downloaded and put it in the issue body for a human to pin.
      - name: Fetch and capture
        id: capture
        if: steps.newest.outputs.unpinned == 'true'
        continue-on-error: true
        # VERSION comes from hashcat's release tag -- third-party data. Passing
        # it through env: keeps it out of the script text; interpolating
        # ${{ }} directly into run: would let a crafted tag name execute here.
        env:
          VERSION: ${{ steps.newest.outputs.version }}
        run: |
          version="${VERSION}"
          url="https://github.com/hashcat/hashcat/releases/download/v${version}/hashcat-${version}.7z"
          mkdir -p "${RUNNER_TEMP}/hc"
          # Same retry budget as tests/hashcat_matrix/fetch.sh -- this job
          # fetches an unpinned tag, so it cannot share that script.
          curl -fsSL --retry 6 --retry-max-time 300 --retry-all-errors \
               --connect-timeout 20 -o "${RUNNER_TEMP}/hc/hashcat.7z" "$url"
          sha="$(sha256sum "${RUNNER_TEMP}/hc/hashcat.7z" | cut -d' ' -f1)"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          7z x -y -o"${RUNNER_TEMP}/hc" "${RUNNER_TEMP}/hc/hashcat.7z" >/dev/null
          bin="${RUNNER_TEMP}/hc/hashcat-${version}/hashcat.bin"
          echo "bin=${bin}" >> "$GITHUB_OUTPUT"
          tests/hashcat_matrix/capture.sh "$bin" "${RUNNER_TEMP}/capture"
          python tests/hashcat_matrix/summarize.py "${RUNNER_TEMP}/capture"
          mkdir -p "tests/fixtures/hashcat/${version}"
          cp "${RUNNER_TEMP}"/capture/* "tests/fixtures/hashcat/${version}/"
          python -m pytest tests/agent_unit/test_hashcat_contract.py -q -rxX -k "${version}"
          HASHCAT_BIN="$bin" python -m pytest tests/hashcat_matrix -q

      - name: Upload capture
        if: steps.newest.outputs.unpinned == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hashcat-capture-${{ steps.newest.outputs.version }}
          path: ${{ runner.temp }}/capture
          retention-days: 30
          if-no-files-found: warn

      # Idempotent: search for an open issue with the same title before creating.
      - name: Open an issue for the unpinned release
        if: steps.newest.outputs.unpinned == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.newest.outputs.version }}
          SHA256: ${{ steps.capture.outputs.sha256 }}
          RESULT: ${{ steps.capture.outcome }}
        run: |
          # The download may have failed before a checksum was computed; say so
          # rather than rendering an empty sha for someone to paste into a pin.
          sha_text="${SHA256:-(download failed - recompute before pinning)}"
          title="hashcat ${VERSION} is not in the interop matrix"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            echo "Issue #${existing} already open; not filing a duplicate."
            exit 0
          fi
          {
            echo "hashcat **${VERSION}** has been released and is not pinned in"
            echo "\`.github/workflows/hashcat-matrix.yml\`."
            echo
            echo "Contract test result against the new release: **${RESULT}**."
            echo
            if [ "${RESULT}" != "success" ]; then
              echo "The interop contract did NOT hold. Download the"
              echo "\`hashcat-capture-${VERSION}\` artifact from this run to see the"
              echo "actual output before changing any parser."
              echo
            fi
            echo "To pin it, add to the \`pinned\` matrix:"
            echo
            echo '```yaml'
            echo "          - version: \"${VERSION}\""
            echo "            sha256: \"${sha_text}\""
            echo "            blocking: true"
            echo '```'
            echo
            echo "and commit a fixture directory for it (see TESTING.md,"
            echo "\"Refreshing hashcat fixtures\")."
            echo
            echo "Filed automatically by the hashcat Matrix workflow."
          } > /tmp/issue-body.md
          gh issue create --title "${title}" --body-file /tmp/issue-body.md

  # Tier 4. The pinned and floating tiers both only ever see a RELEASE, so the
  # earliest they can report a break is the day one ships -- by which point the
  # change is already in users' hands. Mode 6800 is the worked example: master
  # gave the LastPass format a fourth field and now rejects the three-field form
  # every released hashcat accepts, and nothing here would have noticed until
  # that landed in a tag.
  #
  # Master is not a release. It breaks, it gets rebased, and it moves daily, so
  # this tier never gates anything: it builds from git, runs the same contracts,
  # and opens an issue. A red X here is advance warning, not a defect report.
  bleeding-edge:
    name: "hashcat (git master)"
    runs-on: ubuntu-latest
    # A from-source build is several times the cost of unpacking a release.
    timeout-minutes: 45
    # Schedule and manual runs only, for the same reason the floating tier is:
    # an upstream commit must never fail a PR that did not cause it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # 3.13 rather than the 3.11 the other jobs use: hashcat master's own
      # BUILD.md requires Python >= 3.13 to build, and this repo is tested on
      # 3.13 too, so one interpreter serves the build and the test run.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install a build toolchain and a CPU OpenCL device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git \
            p7zip-full pocl-opencl-icd ocl-icd-libopencl1

      # Depth 1: the contract cares what master IS, not how it got there.
      - name: Build hashcat from master
        id: build
        shell: bash
        run: |
          git clone --depth 1 https://github.com/hashcat/hashcat.git "${RUNNER_TEMP}/hashcat-src"
          cd "${RUNNER_TEMP}/hashcat-src"
          commit="$(git rev-parse HEAD)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "short=${commit:0:12}" >> "$GITHUB_OUTPUT"
          make -j"$(nproc)"
          # A native Linux `make` produces ./hashcat; hashcat.bin is the
          # cross-built binary-distribution target. Take whichever exists rather
          # than assuming, so a change to the default target does not read as an
          # interop break. libhashcat.so.N sits beside it and is found there.
          if   [ -x ./hashcat ];     then bin="${PWD}/hashcat"
          elif [ -x ./hashcat.bin ]; then bin="${PWD}/hashcat.bin"
          else echo "::error::no hashcat binary after make"; ls -la; exit 1
          fi
          echo "bin=${bin}" >> "$GITHUB_OUTPUT"
          "$bin" --version

      - name: Capture machine-readable output
        id: capture
        run: |
          tests/hashcat_matrix/capture.sh \
            '${{ steps.build.outputs.bin }}' "${RUNNER_TEMP}/capture"
          python tests/hashcat_matrix/summarize.py "${RUNNER_TEMP}/capture"

      # Every assertion below is continue-on-error with an id, so one broken
      # contract does not hide the state of the others -- the whole value of
      # this tier is a complete picture of what master changed.
      - name: Assert the interop contract against the live capture
        id: contract
        continue-on-error: true
        run: |
          rm -rf tests/fixtures/hashcat/master
          mkdir -p tests/fixtures/hashcat/master
          cp "${RUNNER_TEMP}"/capture/* tests/fixtures/hashcat/master/
          python -m pytest tests/agent_unit/test_hashcat_contract.py -q -rxX -k master

      - name: Assert --skip/--limit slice semantics
        id: slices
        continue-on-error: true
        shell: bash
        env:
          HASHCAT_BIN: ${{ steps.build.outputs.bin }}
        run: python -m pytest tests/hashcat_matrix -q -rs

      # The one that would have caught 6800. Re-derives HASH_CASE_RULES against
      # this binary: for every pinned mode it puts all three spellings of the
      # hash to `hashcat --left` and checks the table reproduces the answer.
      - name: Re-derive the hash-case table against master
        id: hashcase
        continue-on-error: true
        shell: bash
        env:
          HASHCAT_BIN: ${{ steps.build.outputs.bin }}
        run: |
          python -m pytest tests/unit/test_hash_case_normalization.py -q -rs \
            -k reproduces_hashcats_own_answer

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hashcat-capture-master-${{ steps.build.outputs.short }}
          path: ${{ runner.temp }}/capture
          retention-days: 30
          if-no-files-found: warn

      # Idempotent and self-updating: one long-lived issue per drift episode,
      # commented with each new commit rather than refiled, so a weekly schedule
      # does not open 52 issues about the same change.
      - name: Report drift
        if: always() && (steps.contract.outcome == 'failure' || steps.slices.outcome == 'failure' || steps.hashcase.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Third-party data (an upstream commit id) stays in env rather than
          # being interpolated into the script text.
          COMMIT: ${{ steps.build.outputs.commit }}
          CONTRACT: ${{ steps.contract.outcome }}
          SLICES: ${{ steps.slices.outcome }}
          HASHCASE: ${{ steps.hashcase.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="hashcat master has drifted from the interop contract"
          {
            echo "Built from hashcat master at \`${COMMIT}\`."
            echo
            echo "| Contract | Result |"
            echo "|---|---|"
            echo "| Agent parses --status-json / benchmark / outfile | ${CONTRACT} |"
            echo "| --skip/--limit slice semantics | ${SLICES} |"
            echo "| HASH_CASE_RULES reproduces hashcat's own spelling | ${HASHCASE} |"
            echo
            echo "[Run log and captured output](${RUN_URL})"
            echo
            echo "This is master, not a release, so nothing is broken for users"
            echo "yet and no gate is red. It is advance warning that a shipped"
            echo "hashcat will break one of these unless the change is reverted"
            echo "upstream or absorbed here first."
            echo
            echo "Filed automatically by the hashcat Matrix workflow."
          } > /tmp/master-drift.md
          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file /tmp/master-drift.md
          else
            gh issue create --title "${title}" --body-file /tmp/master-drift.md
          fi
