[pytest]
testpaths = tests
python_files = test_*.py
markers =
    e2e: end-to-end tests using Playwright
    agent_sim: agent simulator tests
    security: security-focused tests
    e2e_crack: dockerized multi-agent real-crack e2e test (opt-in; needs compose + rockyou)
    perf: job-creation performance tests (opt-in; needs a live host seeded by tests/seed_perf_db.py)
    mysql: integration tests that run against a real MySQL/MariaDB backend (needs HASHVIEW_TEST_DATABASE_URI)
    migration: end-to-end main->dev database migration test (needs docker + built images)
    hashcat_matrix: live hashcat interop tests (opt-in; needs HASHCAT_BIN)
    docker_analytics: /analytics bug hunt against a running docker stack (needs HASHVIEW_DOCKER_BASE_URL)
    hashcat_interop: live hashcat Kerberos AES-mode interop tests (needs HASHCAT_BIN; see tests/hashcat_interop/)
filterwarnings =
    ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated.*:DeprecationWarning:sqlalchemy\.
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning:sqlalchemy\.
    # A deprecated SQLAlchemy construct is a bug report from the library, and it
    # only ever gets louder: the pin is sqlalchemy==1.4.27 and nothing in the
    # repo can bump it, so these accumulate silently until someone upgrades and
    # they all land at once. Issue #373 is the worked example -- four queries
    # passed a column to Query.distinct(), which is PostgreSQL's DISTINCT ON:
    # every other backend drops the argument and warns. It sat in the warnings
    # summary of every CI run for months because nothing reads that summary.
    # SQLite warns identically to MySQL here, so the unit suite could have
    # caught it from day one.
    error::sqlalchemy.exc.SADeprecationWarning
