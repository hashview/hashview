[tool.ruff]
target-version = "py311"
# Match .pylintrc's max-line-length so the two linters agree on width.
line-length = 100
# Autogenerated Alembic migrations — .pylintrc ignores these too (ignore-paths).
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # Line length is enforced by pylint (max-line-length = 100); don't double-flag.
    "E501",
    # `== True` / `== False`: this is a SQLAlchemy codebase and column
    # comparisons like `Hashes.cracked == True` compile to SQL `= 1`. Rewriting
    # them to truthiness (`if Hashes.cracked:`) would change the generated SQL,
    # so the rule produces false positives here.
    "E712",
    # printf `%`-style formatting (`'%d' % n`): kept intentionally. `%d` coerces
    # its operand to int and several sites build regex `{N}` quantifiers
    # (`r'[0-9a-fA-F]{%d}'`), so a blind f-string rewrite would be
    # behavior-changing. `.format()` usages are still modernized via UP032.
    "UP031",
]

[tool.bandit]
# tests/ feeds intentionally malformed/hostile inputs; control/ is runtime data;
# migrations/ is autogenerated. Scan first-party server + agent code only.
exclude_dirs = ["tests", "venv", ".venv", "migrations", "hashview/control"]

[tool.mutmut]
# Mutation testing is a PERIODIC QUALITY SIGNAL, not a CI gate. It runs only on a
# weekly schedule / manual dispatch (.github/workflows/mutation.yml), never on
# push/PR — a full campaign is far too slow to block development.
#
# Config schema is mutmut 3.x (pinned 3.6.0 in requirements-dev.txt). In 3.x the
# old `paths_to_mutate`/`tests_dir`/`runner` keys are deprecated; the current keys
# are `source_paths`, `pytest_add_cli_args_test_selection`, and `do_not_mutate`.
source_paths = ["hashview"]
# Scope the test run to the fast unit suite so each mutant is validated quickly.
pytest_add_cli_args_test_selection = ["tests/unit"]
# Autogenerated Alembic migrations live in top-level migrations/, already outside
# source_paths, and Jinja templates under hashview/templates/ aren't .py so they're
# never mutated. We still exclude runtime control data explicitly for safety.
# Patterns must end in ".py" or "*".
do_not_mutate = [
    "migrations/*",
    "hashview/control/*",
]
