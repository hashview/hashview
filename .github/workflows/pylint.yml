name: Pylint

# `pull_request` covers every branch that has a PR open, so `push` is scoped to the
# long-lived branches. An unscoped `push` next to `pull_request` runs this whole
# workflow twice on a single PR-branch commit, once per event.
on:
  push:
    branches: [main, "v*-dev"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Supported range is Python 3.11+ (must match the setup.py floor).
      matrix:
        python-version: [
          "3.11",
          "3.12",
          "3.13"
        ]
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install --requirement requirements.txt
    - name: Analyzing the code with pylint
      run: |
        pylint --verbose --jobs=1 --rcfile=.pylintrc --output-format=colorized --reports=n --score=y hashview/ hashview.py
