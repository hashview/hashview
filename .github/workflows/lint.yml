name: Lint & Security

# `pull_request` covers every branch that has a PR open, so `push` is scoped to the
# long-lived branches. An unscoped `push` next to `pull_request` runs this whole
# workflow twice on a single PR-branch commit, once per event.
on:
  push:
    branches: [main, "v*-dev"]
  pull_request:

jobs:
  # Ruff: fast lint (imports, bugbear, pyupgrade, pycodestyle). Config and rule
  # selection live in pyproject.toml. Complements the existing pylint workflow.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Pinned to the 3.11 floor; multi-version testing lives in pylint.yml + unit-tests.yml.
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.9.7
      - name: ruff check
        run: ruff check .

  # Bandit SAST against the committed baseline — only NEW findings (not already
  # in .bandit-baseline.json) fail the build. Scans the server + agent.
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install "bandit[toml]==1.9.4"
      - name: bandit (vs baseline)
        run: bandit -r hashview install/hashview-agent -c pyproject.toml -b .bandit-baseline.json
      # Bandit matches baseline entries on (file, test ID, message) and ignores the
      # line number, so an entry whose code was fixed does not go inert — it becomes
      # a standing file-scoped exemption for that test ID. This step fails when the
      # baseline holds findings that no longer reproduce, so it cannot drift again.
      - name: bandit baseline is not stale
        run: python scripts/check_bandit_baseline.py

  # pip-audit: fail on dependencies with known CVEs (PyPI / OSV advisory DB).
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.0
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt

  # OpenAPI: structural validation of the committed API spec. Route<->spec
  # parity is additionally enforced by tests/unit/test_openapi_spec.py (runs
  # in CI via .github/workflows/unit-tests.yml).
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install validator
        run: pip install openapi-spec-validator==0.7.1
      - name: Validate OpenAPI spec
        run: openapi-spec-validator hashview/api_docs/openapi.yaml
